<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rizzler AI 🔥</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: auto;
        }

        /* HEADER */

        header {
            padding: 20px;
            border-bottom: 1px solid #222;
            text-align: center;
        }

        header h1 {
            font-size: 21px;
            font-weight: 700;
        }

        header p {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 18px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-top: 20vh;
            font-size: 15px;
        }

        .welcome strong {
            display: block;
            color: #eee;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: #252525;
            border-bottom-right-radius: 5px;
        }

        .message.ai .bubble {
            background: transparent;
            padding-left: 3px;
            color: #e8e8e8;
        }

        .image-message {
            max-width: 240px;
            border-radius: 14px;
            display: block;
            margin-bottom: 8px;
        }

        /* STYLES */

        .styles {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 15px;
            border-top: 1px solid #1c1c1c;
        }

        .styles::-webkit-scrollbar {
            display: none;
        }

        .style-btn {
            flex-shrink: 0;
            border: 1px solid #292929;
            background: #111;
            color: #aaa;
            border-radius: 20px;
            padding: 8px 13px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .style-btn:hover {
            background: #1d1d1d;
            color: white;
        }

        .style-btn.active {
            background: #eee;
            color: #111;
            border-color: #eee;
        }

        /* IMAGE PREVIEW */

        #imagePreview {
            display: none;
            padding: 8px 15px;
            border-top: 1px solid #1c1c1c;
            position: relative;
        }

        #previewImage {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #333;
        }

        #removeImage {
            position: absolute;
            top: 2px;
            left: 82px;
            width: 23px;
            height: 23px;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        /* INPUT */

        .input-area {
            padding: 12px 15px 18px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 25px;
            padding: 7px 8px 7px 10px;
        }

        #messageInput {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.4;
            max-height: 120px;
            padding: 8px 4px;
        }

        #messageInput::placeholder {
            color: #666;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .icon-btn:hover {
            background: #242424;
            color: white;
        }

        #sendBtn {
            background: #eee;
            color: #111;
            font-size: 20px;
        }

        #sendBtn:hover {
            background: white;
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #imageInput {
            display: none;
        }

        /* LOADING */

        .loading {
            color: #777;
            font-size: 14px;
        }

        .loading span {
            animation: blink 1.4s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            #chat {
                padding: 20px 13px;
            }

            .bubble {
                max-width: 88%;
            }

            .styles {
                padding-left: 10px;
                padding-right: 10px;
            }

            .input-area {
                padding: 8px 10px 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>
        <h1>Rizzler AI 🔥</h1>
        <p>teu wingman digital</p>
    </header>


    <!-- CHAT -->

    <main id="chat">

        <div class="welcome" id="welcome">

            <strong>Rizzler AI 🔥</strong>

            Manda uma mensagem ou um screenshot
            e deixa comigo.

        </div>

    </main>


    <!-- STYLES -->

    <div class="styles">

        <button class="style-btn active" data-style="natural">
            😌 Natural
        </button>

        <button class="style-btn" data-style="confiante">
            😎 Confiante
        </button>

        <button class="style-btn" data-style="engraçado">
            😂 Engraçado
        </button>

        <button class="style-btn" data-style="amigavel">
            🙂 Amigável
        </button>

        <button class="style-btn" data-style="romantico">
            ❤️ Romântico
        </button>

        <button class="style-btn" data-style="atrevido">
            😏 Atrevido
        </button>

        <button class="style-btn" data-style="direto">
            🎯 Direto
        </button>

    </div>


    <!-- IMAGE PREVIEW -->

    <div id="imagePreview">

        <img
            id="previewImage"
            alt="Imagem selecionada"
        >

        <button id="removeImage">
            ×
        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-btn"
                id="attachBtn"
                title="Enviar imagem"
            >
                📎
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Manda a mensagem..."
            ></textarea>

            <button
                class="icon-btn"
                id="sendBtn"
                title="Enviar"
            >
                ↑
            </button>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // ELEMENTOS
    // ==========================================

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    const messageInput =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const attachBtn =
        document.getElementById("attachBtn");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreview =
        document.getElementById("imagePreview");

    const previewImage =
        document.getElementById("previewImage");

    const removeImage =
        document.getElementById("removeImage");


    // ==========================================
    // ESTADO
    // ==========================================

    let selectedStyle = "natural";

    let selectedImage = null;


    // ==========================================
    // ESCOLHER ESTILO
    // ==========================================

    document
        .querySelectorAll(".style-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".style-btn")
                        .forEach(btn =>
                            btn.classList.remove("active")
                        );

                    button.classList.add("active");

                    selectedStyle =
                        button.dataset.style;

                }
            );

        });


    // ==========================================
    // ABRIR GALERIA
    // ==========================================

    attachBtn.addEventListener(
        "click",
        () => {

            imageInput.click();

        }
    );


    // ==========================================
    // CONVERTER IMAGEM
    // ==========================================

    function fileToDataURL(file) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();

                reader.onload =
                    () => resolve(
                        reader.result
                    );

                reader.onerror =
                    reject;

                reader.readAsDataURL(file);

            }
        );

    }


    // ==========================================
    // SELECIONAR IMAGEM
    // ==========================================

    imageInput.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {

                alert(
                    "Seleciona uma imagem."
                );

                return;
            }

            try {

                selectedImage =
                    await fileToDataURL(file);

                previewImage.src =
                    selectedImage;

                imagePreview.style.display =
                    "block";

            } catch (error) {

                console.error(
                    "Erro ao carregar imagem:",
                    error
                );

                alert(
                    "Não foi possível carregar a imagem."
                );

            }

        }
    );


    // ==========================================
    // REMOVER IMAGEM
    // ==========================================

    removeImage.addEventListener(
        "click",
        () => {

            selectedImage = null;

            imageInput.value = "";

            previewImage.src = "";

            imagePreview.style.display =
                "none";

        }
    );


    // ==========================================
    // ADICIONAR MENSAGEM AO CHAT
    // ==========================================

    function addMessage(
        text,
        type,
        image = null
    ) {

        if (welcome) {

            welcome.style.display =
                "none";

        }

        const message =
            document.createElement("div");

        message.className =
            `message ${type}`;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        // IMAGEM

        if (image) {

            const img =
                document.createElement("img");

            img.src = image;

            img.className =
                "image-message";

            img.alt =
                "Imagem enviada";

            bubble.appendChild(img);

        }


        // TEXTO

        if (text) {

            const textElement =
                document.createElement("div");

            textElement.textContent =
                text;

            bubble.appendChild(
                textElement
            );

        }


        message.appendChild(
            bubble
        );

        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    // ==========================================
    // LOADING
    // ==========================================

    function addLoading() {

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        message.id =
            "loadingMessage";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble loading";

        bubble.innerHTML =
            "Rizzler está a pensar<span>...</span>";


        message.appendChild(
            bubble
        );

        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    function removeLoading() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );

        if (loading) {

            loading.remove();

        }

    }


    // ==========================================
    // ENVIAR MENSAGEM
    // ==========================================

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        // Não envia vazio

        if (
            !message &&
            !selectedImage
        ) {

            return;

        }


        // Guardar imagem antes de limpar

        const imageData =
            selectedImage;


        // Mostrar no chat

        addMessage(
            message,
            "user",
            imageData
        );


        // Limpar interface

        messageInput.value = "";

        selectedImage = null;

        imageInput.value = "";

        imagePreview.style.display =
            "none";

        previewImage.src = "";


        addLoading();

        sendBtn.disabled = true;


        try {

            // ==================================
            // ENVIAR TEXTO + IMAGEM
            // ==================================

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                style:
                                    selectedStyle,

                                image:
                                    imageData || null

                            })

                    }
                );


            const data =
                await response.json();


            removeLoading();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Erro ao contactar o Rizzler."
                );

            }


            // ==================================
            // RESPOSTA DA IA
            // ==================================

            addMessage(
                data.response,
                "ai"
            );


        } catch (error) {

            removeLoading();

            console.error(
                "Erro:",
                error
            );


            addMessage(
                "Deu erro ao contactar o Rizzler. Tenta novamente.",
                "ai"
            );

        } finally {

            sendBtn.disabled =
                false;

            messageInput.focus();

        }

    }


    // ==========================================
    // BOTÃO ENVIAR
    // ==========================================

    sendBtn.addEventListener(
        "click",
        sendMessage
    );


    // ==========================================
    // ENTER
    // ==========================================

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // ==========================================
    // AUTO-RESIZE
    // ==========================================

    messageInput.addEventListener(
        "input",
        () => {

            messageInput.style.height =
                "auto";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    120
                ) + "px";

        }
    );

</script>

</body>
</html>
