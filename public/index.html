<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rizzler AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 65px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            padding: 0 22px;
            background: #0a0a0a;
            flex-shrink: 0;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .status {
            margin-left: 12px;
            font-size: 12px;
            color: #777;
        }

        /* =========================
           CHAT
        ========================= */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 190px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 700px;
            margin: 90px auto 0;
            text-align: center;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #888;
            font-size: 16px;
        }

        .message {
            max-width: 760px;
            margin: 0 auto 20px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #242424;
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .ai .bubble {
            background: transparent;
            color: #e8e8e8;
            padding-left: 0;
            border-bottom-left-radius: 5px;
        }

        /* =========================
           IMAGEM NA MENSAGEM
        ========================= */

        .message-image {
            display: block;
            max-width: 260px;
            max-height: 300px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 8px;
        }

        .image-label {
            font-size: 11px;
            color: #777;
            margin-bottom: 5px;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .typing span {
            width: 5px;
            height: 5px;
            background: #888;
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }

        /* =========================
           INPUT AREA
        ========================= */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px 20px;

            background: linear-gradient(
                transparent,
                #0a0a0a 25%
            );
        }

        /* =========================
           ESTILOS
        ========================= */

        .styles {
            max-width: 760px;
            margin: 0 auto 9px;

            display: flex;
            gap: 7px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .styles::-webkit-scrollbar {
            display: none;
        }

        .style-button {
            flex-shrink: 0;

            border: 1px solid #292929;
            background: #121212;
            color: #888;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

            cursor: pointer;

            transition:
                background 0.2s,
                color 0.2s,
                border 0.2s;
        }

        .style-button:hover {
            border-color: #444;
            color: #ddd;
        }

        .style-button.active {
            background: #f5f5f5;
            color: #000;
            border-color: #f5f5f5;
        }

        /* =========================
           PREVIEW DA IMAGEM
        ========================= */

        .image-preview {
            max-width: 760px;
            margin: 0 auto 8px;
            display: none;
            position: relative;
        }

        .image-preview.visible {
            display: block;
        }

        .preview-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .remove-image {
            position: absolute;

            top: -7px;
            left: 67px;

            width: 22px;
            height: 22px;

            border: 1px solid #444;
            border-radius: 50%;

            background: #171717;
            color: #fff;

            cursor: pointer;

            font-size: 13px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-box {
            max-width: 760px;
            margin: auto;

            background: #171717;

            border: 1px solid #292929;

            border-radius: 18px;

            display: flex;
            align-items: flex-end;

            padding: 10px;

            transition: border 0.2s;
        }

        .input-box:focus-within {
            border-color: #444;
        }

        /* =========================
           BOTÃO DE IMAGEM
        ========================= */

        .attach-button {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: transparent;
            color: #888;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s,
                color 0.2s;
        }

        .attach-button:hover {
            background: #242424;
            color: #fff;
        }

        #imageInput {
            display: none;
        }

        /* =========================
           TEXTAREA
        ========================= */

        textarea {
            flex: 1;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            line-height: 1.5;

            padding: 8px 10px;

            min-height: 42px;
            max-height: 150px;

            font-family: inherit;
        }

        textarea::placeholder {
            color: #666;
        }

        /* =========================
           SEND
        ========================= */

        #send {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 12px;

            background: white;
            color: black;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        #send:hover {
            transform: scale(1.05);
        }

        #send:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
        }

        .footer {
            text-align: center;

            color: #555;

            font-size: 11px;

            margin-top: 7px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 16px;
            }

            .logo {
                font-size: 19px;
            }

            .status {
                display: none;
            }

            #chat {
                padding:
                    25px 14px 200px;
            }

            .welcome {
                margin-top: 70px;
            }

            .welcome h1 {
                font-size: 28px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding:
                    10px 10px 14px;
            }

            .input-box {
                border-radius: 16px;
            }

            .styles {
                margin-bottom: 8px;
            }

            .message-image {
                max-width: 220px;
            }

        }

    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="logo">
            Rizzler AI 🔥
        </div>

        <div class="status">
            teu wingman digital
        </div>

    </header>


    <!-- CHAT -->

    <main id="chat">

        <div class="welcome" id="welcome">

            <h1>
                Sem resposta? 😏
            </h1>

            <p>
                Manda a situação. O Rizzler pensa contigo.
            </p>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <!-- ESTILOS -->

        <div class="styles">

            <button
                class="style-button active"
                data-style="natural">
                😌 Natural
            </button>

            <button
                class="style-button"
                data-style="confiante">
                😎 Confiante
            </button>

            <button
                class="style-button"
                data-style="engraçado">
                😂 Engraçado
            </button>

            <button
                class="style-button"
                data-style="amigavel">
                🙂 Amigável
            </button>

            <button
                class="style-button"
                data-style="romantico">
                ❤️ Romântico
            </button>

            <button
                class="style-button"
                data-style="atrevido">
                😏 Atrevido
            </button>

            <button
                class="style-button"
                data-style="direto">
                🎯 Direto
            </button>

        </div>


        <!-- PREVIEW -->

        <div
            class="image-preview"
            id="imagePreview">

            <img
                id="previewImage"
                class="preview-image"
                alt="Imagem selecionada">

            <button
                class="remove-image"
                id="removeImage"
                title="Remover imagem">
                ×
            </button>

        </div>


        <!-- INPUT BOX -->

        <div class="input-box">

            <!-- INPUT ESCONDIDO -->

            <input
                type="file"
                id="imageInput"
                accept="image/*">


            <!-- BOTÃO -->

            <button
                class="attach-button"
                id="attachButton"
                title="Adicionar imagem">
                📎
            </button>


            <!-- TEXTO -->

            <textarea
                id="message"
                rows="1"
                placeholder="Conta-me a situação..."
            ></textarea>


            <!-- ENVIAR -->

            <button
                id="send"
                title="Enviar">
                ↑
            </button>

        </div>


        <div class="footer">
            O Rizzler pode errar. Confirma antes de enviar algo importante.
        </div>

    </div>

</div>


<script>

    const messageInput =
        document.getElementById(
            "message"
        );

    const sendButton =
        document.getElementById(
            "send"
        );

    const chat =
        document.getElementById(
            "chat"
        );

    const welcome =
        document.getElementById(
            "welcome"
        );

    const imageInput =
        document.getElementById(
            "imageInput"
        );

    const attachButton =
        document.getElementById(
            "attachButton"
        );

    const imagePreview =
        document.getElementById(
            "imagePreview"
        );

    const previewImage =
        document.getElementById(
            "previewImage"
        );

    const removeImage =
        document.getElementById(
            "removeImage"
        );


    // =====================================
    // ESTILO
    // =====================================

    let selectedStyle =
        "natural";


    const styleButtons =
        document.querySelectorAll(
            ".style-button"
        );


    styleButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    styleButtons.forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );

                    button.classList.add(
                        "active"
                    );

                    selectedStyle =
                        button.dataset.style;

                }
            );

        }
    );


    // =====================================
    // IMAGEM
    // =====================================

    let selectedImage = null;


    attachButton.addEventListener(
        "click",
        () => {

            imageInput.click();

        }
    );


    imageInput.addEventListener(
        "change",
        () => {

            const file =
                imageInput.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith(
                "image/"
            )) {

                alert(
                    "Escolhe uma imagem válida."
                );

                imageInput.value = "";

                return;

            }


            selectedImage =
                file;


            const reader =
                new FileReader();


            reader.onload = event => {

                previewImage.src =
                    event.target.result;

                imagePreview.classList.add(
                    "visible"
                );

            };


            reader.readAsDataURL(file);

        }
    );


    removeImage.addEventListener(
        "click",
        () => {

            selectedImage =
                null;

            imageInput.value =
                "";

            previewImage.src =
                "";

            imagePreview.classList.remove(
                "visible"
            );

        }
    );


    // =====================================
    // ADICIONAR MENSAGEM
    // =====================================

    function addMessage(
        text,
        type,
        image = null
    ) {

        if (welcome) {
            welcome.remove();
        }


        const message =
            document.createElement(
                "div"
            );

        message.className =
            `message ${type}`;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";


        if (image) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "image-label";

            label.textContent =
                "Imagem enviada";

            bubble.appendChild(
                label
            );


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "message-image";

            img.src =
                image;

            bubble.appendChild(
                img
            );

        }


        if (text) {

            const textElement =
                document.createElement(
                    "div"
                );

            textElement.textContent =
                text;

            bubble.appendChild(
                textElement
            );

        }


        message.appendChild(
            bubble
        );

        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;


        return message;

    }


    // =====================================
    // LOADING
    // =====================================

    function addTyping() {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message ai";

        message.id =
            "typing";


        message.innerHTML = `

            <div class="bubble">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        chat.appendChild(
            message
        );

        chat.scrollTop =
            chat.scrollHeight;

    }


    // =====================================
    // ENVIAR
    // =====================================

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        // Nesta etapa,
        // a imagem ainda é apenas visual.

        if (
            !message &&
            !selectedImage
        ) {

            return;

        }


        let imageData = null;


        if (selectedImage) {

            imageData =
                await fileToDataURL(
                    selectedImage
                );

        }


        addMessage(
            message,
            "user",
            imageData
        );


        messageInput.value =
            "";

        messageInput.style.height =
            "42px";


        selectedImage =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        imagePreview.classList.remove(
            "visible"
        );


        sendButton.disabled =
            true;


        addTyping();


        try {

            /*
             * Por enquanto enviamos apenas
             * a mensagem para a API.
             *
             * A análise da imagem será
             * adicionada no próximo passo.
             */

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                style:
                                    selectedStyle

                            })

                    }
                );


            const data =
                await response.json();


            const typing =
                document.getElementById(
                    "typing"
                );


            if (typing) {
                typing.remove();
            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Erro desconhecido."
                );

            }


            addMessage(
                data.response,
                "ai"
            );


        } catch (error) {

            const typing =
                document.getElementById(
                    "typing"
                );


            if (typing) {
                typing.remove();
            }


            addMessage(
                "Deu erro aqui 😭: " +
                error.message,
                "ai"
            );


        } finally {

            sendButton.disabled =
                false;

            messageInput.focus();

        }

    }


    // =====================================
    // FILE → BASE64
    // =====================================

    function fileToDataURL(file) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();

                reader.onload =
                    () => resolve(
                        reader.result
                    );

                reader.onerror =
                    reject;

                reader.readAsDataURL(
                    file
                );

            }
        );

    }


    // =====================================
    // BOTÃO ENVIAR
    // =====================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // =====================================
    // ENTER
    // =====================================

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =====================================
    // TEXTAREA
    // =====================================

    messageInput.addEventListener(
        "input",
        () => {

            messageInput.style.height =
                "42px";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    150
                ) + "px";

        }
    );

</script>

</body>
</html>
